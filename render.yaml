# Hugging Face engine deployment: Node API plus existing MongoDB Atlas.
# For the existing dunkai.onrender.com service, import the generated settings
# and redeploy instead of creating another service.
services:
  - type: web
    name: dunkai-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: LOCAL_RUNTIME_ENABLED
        value: "false"
      - key: SUPERVISOR_AGENT_URL
        value: https://rayyanshk-dunkai.hf.space
      - key: SUPERVISOR_AGENT_PATH
        value: /api/v1/supervisor
      - key: SUPERVISOR_AGENT_TOKEN
        sync: false
      - key: SUPERVISOR_HF_TOKEN
        sync: false
      - key: ARCHIVE_SUPERVISOR_ARTIFACTS
        value: "true"
      - key: CREDIT_METERING_ENABLED
        value: "true"
      - key: BILLING_ENABLED
        value: "false"
      - key: AI_QUEUE_ENABLED
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: BYOK_ENCRYPTION_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: HF_TOKEN_READ
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: TRUST_PROXY
        value: "1"
