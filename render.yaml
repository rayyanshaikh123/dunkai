# Browser execution deployment: Node API only, existing MongoDB Atlas.
# For your existing hosted API, update its environment and redeploy instead
# of creating another service. Legacy paid services: render.cloud.yaml.
services:
  - type: web
    name: dunkai-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: BROWSER_COMPUTE_ONLY
        value: "true"
      - key: BILLING_ENABLED
        value: "false"
      - key: AI_QUEUE_ENABLED
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: BYOK_ENCRYPTION_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BROWSER_MODEL
        value: openai/gpt-oss-120b
      - key: FRONTEND_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: TRUST_PROXY
        value: "1"
