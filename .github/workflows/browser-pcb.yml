name: Browser PCB smoke test

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:credits
      - run: npm run test:credit-config
      - run: npm run test:database-dns
      - run: npm run test:browser-compute
      - run: npm run test:browser-free
  browsers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        browser: [chromium, firefox, webkit]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_BROWSER_COMPUTE_ONLY: 'true'
      - run: npm run test:browser-pcb
      - run: npm run test:e2e -- --project=${{ matrix.browser }}
        env:
          NEXT_PUBLIC_BROWSER_COMPUTE_ONLY: 'true'
